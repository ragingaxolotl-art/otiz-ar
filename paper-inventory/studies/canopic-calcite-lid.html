<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Object study</title><style>[hidden]{display:none!important}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#243a32}canvas{display:block;touch-action:none;width:100%;height:100%;cursor:grab}p{position:absolute;inset:0;display:grid;place-items:center;color:#e8d8b7;font:14px system-ui;pointer-events:none}</style><p id="status">Opening object…</p><script src="../../vendor/aframe.min.js"></script><script>
const MODEL={"url": "../../assets/egypt/models/canopic-chest-opening.glb"},PART="calcite-chest-lid";
const T=AFRAME.THREE,renderer=new T.WebGLRenderer({antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.3;document.body.append(renderer.domElement);
const scene=new T.Scene(),camera=new T.PerspectiveCamera(35,1,.01,100),group=new T.Group();scene.add(group);scene.add(new T.HemisphereLight(0xfff3d4,0x638b78,2));
for(const [color,intensity,x,y,z]of[[0xfff5d9,3,3,5,5],[0xb7dfd6,2,-4,2,1],[0xffd48d,2,0,3,-4]]){const light=new T.DirectionalLight(color,intensity);light.position.set(x,y,z);scene.add(light);}
let distance=4.5,defaultDistance=4.5,points=new Map(),pinchDistance=0;
function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();}
function reset(){group.rotation.set(.08,-.25,0);defaultDistance=3.8/Math.min(1,camera.aspect);distance=defaultDistance;}
function zoom(factor){distance=Math.max(defaultDistance*.45,Math.min(defaultDistance*2.3,distance*factor));}
const canvas=renderer.domElement;canvas.setAttribute('aria-label','Rotatable 3D study model');canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);points.set(e.pointerId,{x:e.clientX,y:e.clientY});pinchDistance=0;});canvas.addEventListener('pointermove',e=>{const prev=points.get(e.pointerId);if(!prev)return;if(points.size===1){group.rotation.y+=(e.clientX-prev.x)*.012;group.rotation.x+=(e.clientY-prev.y)*.012;}points.set(e.pointerId,{x:e.clientX,y:e.clientY});if(points.size===2){const[a,b]=[...points.values()],d=Math.hypot(a.x-b.x,a.y-b.y);if(pinchDistance)zoom(pinchDistance/d);pinchDistance=d;}});for(const event of ['pointerup','pointercancel'])canvas.addEventListener(event,e=>{points.delete(e.pointerId);pinchDistance=0;});canvas.addEventListener('wheel',e=>{e.preventDefault();zoom(Math.exp(e.deltaY*.001));},{passive:false});
addEventListener('resize',resize);addEventListener('message',e=>{if(e.source!==parent||e.data?.kind!=='book-study-command')return;if(e.data.command==='zoom-in')zoom(.85);if(e.data.command==='zoom-out')zoom(1.18);if(e.data.command==='reset')reset();});addEventListener('keydown',e=>{if(e.key==='Escape')parent.postMessage({kind:'book-study-close'},'*');});
resize();reset();function draw(){camera.position.set(0,.05,distance);camera.lookAt(0,0,0);renderer.render(scene,camera);requestAnimationFrame(draw);}draw();
(async()=>{try{const gltf=typeof MODEL==='object'&&MODEL.url?await new T.GLTFLoader().loadAsync(MODEL.url):await new Promise((resolve,reject)=>{const bytes=Uint8Array.from(atob(MODEL),c=>c.charCodeAt(0));new T.GLTFLoader().parse(bytes.buffer,'',resolve,reject);});let object=gltf.scene;object.updateMatrixWorld(true);if(PART){const part=new T.Group(),meshes=[];object.traverse(o=>{if(o.isMesh&&o.name.startsWith(PART))meshes.push(o);});meshes.forEach(o=>part.attach(o));object=part;}
const box=new T.Box3().setFromObject(object),size=box.getSize(new T.Vector3()),center=box.getCenter(new T.Vector3()),scale=2/Math.max(size.x,size.y,size.z);if(!Number.isFinite(scale))throw Error('Empty model');object.scale.multiplyScalar(scale);object.position.sub(center.multiplyScalar(scale));group.add(object);document.getElementById('status').hidden=true;parent.postMessage({kind:'book-study-ready'},'*');}catch(error){document.getElementById('status').textContent='This model could not be opened.';parent.postMessage({kind:'book-study-error'},'*');console.error(error);}})();
</script></html>
