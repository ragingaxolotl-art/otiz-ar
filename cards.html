<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Print floor cards · Ötzi Field Lab</title><script src="artifacts.js"></script><style>body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;margin:0;background:#e8e8df;color:#273b29}.toolbar{padding:20px;text-align:center}.toolbar button{background:#324d37;color:white;border:0;padding:14px 25px;border-radius:5px;cursor:pointer;font:inherit}.toolbar a{margin-left:20px;color:#324d37}.card{background:white;box-sizing:border-box;width:8.5in;min-height:11in;margin:20px auto;padding:.65in;text-align:center;page-break-after:always}.card .label{font-size:11px;letter-spacing:.2em;color:#68725e}.card h1{font-size:45px;font-weight:500;margin:20px 0 18px}.card img{width:6.3in;height:6.3in;object-fit:contain;image-rendering:pixelated}.card p{font-size:14px;max-width:5.5in;margin:15px auto;line-height:1.5}.card small{display:block;margin:18px 0;font-size:10px;color:#6e7764}@page{size:letter portrait;margin:0}@media print{body{background:white}.toolbar{display:none}.card{margin:0;box-shadow:none}.card:last-child{page-break-after:auto}}@media screen and (max-width:850px){.card{width:95vw;min-height:120vw;padding:6vw}.card img{width:75vw;height:75vw}.card h1{font-size:32px}}</style></head><body><div class="toolbar"><button onclick="window.print()">Print all 12 cards</button><a href="launch.html">Print the launch QR sheet</a><a href="teacher.html">Teacher setup</a></div><main id="cards"></main><script>document.getElementById('cards').innerHTML=ARTIFACTS.map(a=>`<section class="card"><div class="label">ÖTZI / AR FIELD LAB</div><h1>EVIDENCE ${String(a.n).padStart(2,'0')}</h1><img src="assets/markers/${a.n}.png" alt="AR tracking marker for evidence card ${a.n}"><p>Open the Field Lab scanner in Safari.<br>Keep this whole square in the camera view.<br>Look closely. What could this object reveal?</p><small>3D teaching reconstruction · Printed card ${a.n} of 12</small></section>`).join('');</script></body></html>
