<!doctype html><html lang="en"><meta charset="utf-8"><title>AI teaching copies · tomb checks</title><style>body{font:16px system-ui;background:#e5e2d8}button{padding:12px}iframe{width:1100px;height:650px;border:0;display:block}pre{white-space:pre-wrap}</style><h1>Eleven new teaching copies</h1><button id="run">Test pickup and return</button><output id="result">Ready</output><pre id="report"></pre><iframe id="app" title="Tomb test" src="../tomb.html?qa=ai-eleven-1"></iframe><script>
document.getElementById('run').onclick=async function(){this.disabled=true;const out=document.getElementById('result'),report=[],w=document.getElementById('app').contentWindow,d=w.document;const wait=fn=>new Promise((yes,no)=>{let tries=0;function tick(){if(fn())return yes();if(tries++>1200)return no(Error('Timed out: '+String(fn)));requestAnimationFrame(tick)}tick()});try{
 await wait(()=>!d.getElementById('welcome').hidden);d.getElementById('start-landscape').click();await wait(()=>d.getElementById('asset-status').textContent==='22 / 22 exhibits ready');
 const names=[['fan-ai','Fan'],['throwing-sticks-ai','Throwing sticks'],['lotus-ai','Alabaster perfume jars'],['headrest-ai','Ivory headrest'],['sandals-ai','Sandals'],['model-boat-ai','Model boat'],['model-boat-2-ai','Model boat 2'],['crook-staff-ai','Crook and staff'],['pectoral-ai','Scarab pectoral'],['shield-ai','Shield'],['chariot-ai','Chariot']];
 for(const [id,name]of names){out.textContent='Testing '+name;const select=d.getElementById('exhibit-select');select.value=id;select.dispatchEvent(new Event('change'));await wait(()=>d.getElementById('target-status').textContent.startsWith(name+' ·')&&!d.getElementById('pick').disabled);d.getElementById('pick').click();await wait(()=>d.getElementById('target-status').textContent.startsWith('Holding '+name));await wait(()=>d.getElementById('detail-status').textContent==='Artifact detail: ready');d.getElementById('put-back').click();await wait(()=>!d.getElementById('target-status').textContent.startsWith('Holding '));report.push({id,name,pickup:true,sourceColorDetail:true,return:true});document.getElementById('report').textContent=JSON.stringify(report,null,2);}
 out.textContent='PASS: all eleven teaching copies are reachable, can be picked up, load source color detail and return to their stands.';
 }catch(e){out.textContent='FAIL: '+e.message+'; target='+d.getElementById('target-status')?.textContent+'; toast='+d.getElementById('toast')?.textContent;console.error(e);}finally{this.disabled=false;}};
</script></html>
