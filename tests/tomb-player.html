<!doctype html><meta charset="utf-8"><title>First-person player validation</title><style>body{margin:0;font:14px system-ui;background:#27353b;color:white}#tools{position:absolute;top:12px;left:12px;background:#14201fe8;padding:12px;z-index:2;max-width:420px}button{padding:8px;margin:2px}pre{white-space:pre-wrap}canvas{display:block}</style><div id="tools"><b>Explorer player validation</b><p id="status">Loading…</p><div id="modes"><button>Idle</button><button>Walk</button><button>Run</button><button>Jump</button><button>Crouch</button></div><button id="view">First-person view</button><button id="audit">Run deformation checks</button><output id="audit-result">Not run</output><pre id="report"></pre></div><script src="../vendor/aframe.min.js"></script><script src="../tomb-player.js?v=animated-gait-1"></script><script>
(async()=>{const T=AFRAME.THREE,scene=new T.Scene(),camera=new T.PerspectiveCamera(72,innerWidth/innerHeight,.08,50),observer=new T.PerspectiveCamera(48,innerWidth/innerHeight,.08,50),renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=T.SRGBColorSpace;document.body.append(renderer.domElement);scene.background=new T.Color('#52696a');scene.add(new T.HemisphereLight(0xffffff,0x66633f,2));const sun=new T.DirectionalLight(0xffffff,2);sun.position.set(3,5,4);scene.add(sun);scene.add(new T.GridHelper(100,100));const ground=new T.Mesh(new T.PlaneGeometry(100,100),new T.MeshStandardMaterial({color:'#8b8976'}));ground.rotation.x=-Math.PI/2;ground.position.y=-.015;scene.add(ground);
let mode='Idle',first=false,z=0,phase=0,last=0,lastReport=0;const p=TombPlayer.create({THREE:T,scene,camera,renderer,status:text=>document.getElementById('status').textContent=text});
// The module loads relative to the application, so resolve that URL for this fixture.
const oldLoad=T.GLTFLoader.prototype.loadAsync;T.GLTFLoader.prototype.loadAsync=function(url,...rest){return oldLoad.call(this,url.startsWith('assets/')?'../'+url:url,...rest);};await p.load();T.GLTFLoader.prototype.loadAsync=oldLoad;
document.getElementById('audit').onclick=()=>{
 const out=document.getElementById('audit-result'),group=scene.getObjectByName('Explorer player body'),meshes=[];group.traverse(o=>{if(o.isMesh)meshes.push(o);});
 const assert=(ok,message)=>{if(!ok)throw Error(message);},point=new T.Vector3();
 function shape(){const inverse=group.matrixWorld.clone().invert(),result=[];for(const mesh of meshes){const positions=mesh.geometry.attributes.position;for(let i=0;i<positions.count;i+=Math.max(1,Math.floor(positions.count/150))){mesh.getVertexPosition(i,point);mesh.localToWorld(point);point.applyMatrix4(inverse);result.push(point.clone());}}return result;}
 try{
  assert(p.ready,'Player did not load');assert(meshes.length===3,'Body, shirt and pouch must remain coherent');assert(meshes.every(m=>m.isSkinnedMesh),'Source rig was baked instead of animated');
  const baseState={x:0,z:0,feet:0,height:1.75,grounded:true,crouched:false,started:true};camera.position.set(0,1.6,0);camera.rotation.set(-1.5,0,0);p.reset();p.update(1/60,baseState);const baseline=shape();let maxShapeError=0,maxSoleError=0;
  for(let i=0;i<180;i++){
   const crouched=i%5===0,feet=i%5===1?.8:i%5===2?-1:0,x=i*.016,z=-i*.028,height=crouched?1:1.75;
   camera.fov=[55,72,85,110][i%4];camera.position.set(x,feet+height-.15,z);camera.rotation.set(-1.5,i*.17,Math.sin(i)*.1);camera.updateProjectionMatrix();const before=camera.matrixWorld.clone();camera.updateMatrixWorld(true);const position=camera.position.clone(),rotation=camera.quaternion.clone();
   p.update(1/60,{...baseState,x,z,feet,height,crouched,grounded:i%5!==1,paused:i%7===0});
   const current=shape();current.forEach((v,n)=>maxShapeError=Math.max(maxShapeError,v.distanceTo(baseline[n])));
   const box=new T.Box3().setFromObject(group,true);maxSoleError=Math.max(maxSoleError,Math.abs(box.min.y-feet));assert(camera.position.equals(position)&&camera.quaternion.equals(rotation),'Body moved the camera');
  }
  assert(maxShapeError>.01,'Rig did not animate: '+maxShapeError);assert(maxSoleError<.005,'Soles left physical floor: '+maxSoleError);
  p.setVisible(false);assert(!group.visible,'Visibility toggle failed');p.setVisible(true);p.update(1/60,baseState);assert(group.visible,'Body did not reappear');
  out.textContent='PASS: 180 movement, crouch, jump/drop, turn, roll and view-size combinations; maximum animated vertex displacement '+maxShapeError.toExponential(2)+' m; sole error '+maxSoleError.toExponential(2)+' m. Camera unchanged; body toggle passes.';
 }catch(error){out.textContent='FAIL: '+error.message;console.error(error);}finally{p.reset();camera.fov=72;camera.updateProjectionMatrix();}
};
for(const b of document.querySelectorAll('#modes button'))b.onclick=()=>{mode=b.textContent;phase=0;p.reset();};document.getElementById('view').onclick=()=>{first=!first;document.getElementById('view').textContent=first?'Observer view':'First-person view';};
function frame(t){requestAnimationFrame(frame);const dt=Math.min((t-last)/1000||0,.05);last=t;phase+=dt;const crouched=mode==='Crouch',speed=mode==='Walk'?.95:mode==='Run'?1.9:0,height=crouched?1:1.75,feet=mode==='Jump'?Math.max(0,4.2*(phase%1.2)-4*(phase%1.2)**2):0;z-=speed*dt;camera.position.set(0,feet+height-.15,z);camera.rotation.set(-1.5,0,0);p.update(dt,{x:0,z,feet,height,grounded:mode!=='Jump',crouched,started:true});observer.position.set(2.5,1.8,z+3);observer.lookAt(0,.7,z);renderer.render(scene,first?camera:observer);
if(t-lastReport>350&&p.ready){lastReport=t;const group=scene.getObjectByName('Explorer player body'),box=new T.Box3().setFromObject(group,true);document.getElementById('report').textContent=JSON.stringify({mode,clip:p.state,ready:p.ready,feet:+feet.toFixed(3),soleError:+(box.min.y-feet).toFixed(4),width:+(box.max.x-box.min.x).toFixed(3),depth:+(box.max.z-box.min.z).toFixed(3),height:+(box.max.y-box.min.y).toFixed(3)},null,2);}}
requestAnimationFrame(frame);})().catch(e=>document.getElementById('status').textContent=e.stack);
</script>
